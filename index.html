<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Universe — OmniSolve AI · Powered by GPT-4o, Qwen &amp; DeepSeek, Free</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/12.4.2/math.js"></script>
<script src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/all.min.js"></script>

<style>/* ============================================================
   AI UNIVERSE — Design System
   Display: Space Grotesk · Body: Inter · Mono: JetBrains Mono
   ============================================================ */

:root{
  /* Dark (default) */
  --bg:#0a0c16;
  --bg-soft:#0f1220;
  --surface:#141829;
  --surface-2:#1b2036;
  --border:rgba(255,255,255,0.08);
  --border-strong:rgba(255,255,255,0.14);
  --text:#eef0fb;
  --text-dim:#a7acc8;
  --text-faint:#6c7195;

  --violet:#7c5cff;
  --cyan:#00e0c6;
  --amber:#ffb23f;
  --coral:#ff6b5b;
  --green:#3ddc97;

  --grad-main: linear-gradient(120deg,#7c5cff 0%, #00b8ff 50%, #00e0c6 100%);
  --grad-warm: linear-gradient(120deg,#ff6b5b 0%, #ffb23f 100%);
  --grad-card: linear-gradient(160deg, rgba(124,92,255,0.14), rgba(0,224,198,0.06));

  --shadow-glow: 0 0 0 1px rgba(124,92,255,0.15), 0 20px 60px -20px rgba(124,92,255,0.35);
  --radius-lg:22px;
  --radius-md:16px;
  --radius-sm:10px;
  --font-display:'Space Grotesk', sans-serif;
  --font-body:'Inter', sans-serif;
  --font-mono:'JetBrains Mono', monospace;
}

[data-theme="light"]{
  --bg:#f6f7fc;
  --bg-soft:#ffffff;
  --surface:#ffffff;
  --surface-2:#eef0fb;
  --border:rgba(20,22,40,0.08);
  --border-strong:rgba(20,22,40,0.14);
  --text:#10122a;
  --text-dim:#4d5078;
  --text-faint:#888cab;
  --shadow-glow: 0 0 0 1px rgba(124,92,255,0.10), 0 20px 50px -25px rgba(124,92,255,0.25);
}

*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  -webkit-font-smoothing:antialiased;
  transition:background .35s ease,color .35s ease;
  overflow-x:hidden;
}
img{max-width:100%;}
a{color:inherit;text-decoration:none;}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;letter-spacing:-0.01em;}
p{margin:0;line-height:1.6;}
ul{margin:0;padding:0;}
button{font-family:var(--font-body);cursor:pointer;}
::selection{background:var(--violet);color:#fff;}

.container{max-width:1240px;margin:0 auto;padding:0 24px;}
.eyebrow{
  font-family:var(--font-mono);
  font-size:12px;
  letter-spacing:0.12em;
  text-transform:uppercase;
  color:var(--cyan);
  display:flex;align-items:center;gap:8px;
}
.eyebrow::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--cyan);box-shadow:0 0 12px var(--cyan);}

.grad-text{
  background:var(--grad-main);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  font-weight:600;font-size:15px;font-family:var(--font-body);
  padding:13px 26px;border-radius:999px;border:1px solid transparent;
  transition:transform .25s ease, box-shadow .25s ease, background .25s ease, color .25s ease, border-color .25s ease;
  white-space:nowrap;
}
.btn-primary{
  background:var(--grad-main); color:#08091a;
  box-shadow:0 12px 30px -10px rgba(124,92,255,0.6);
}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 16px 36px -8px rgba(124,92,255,0.7);}
.btn-ghost{
  background:transparent;border:1px solid var(--border-strong);color:var(--text);
}
.btn-ghost:hover{border-color:var(--cyan);color:var(--cyan);transform:translateY(-2px);}
.btn-sm{padding:9px 18px;font-size:13px;}
.btn-block{width:100%;}
.btn[disabled]{opacity:0.5;cursor:not-allowed;transform:none !important;}

/* ---------- nav ---------- */
.nav{
  position:sticky;top:0;z-index:100;
  backdrop-filter:blur(16px);
  background:color-mix(in srgb, var(--bg) 75%, transparent);
  border-bottom:1px solid var(--border);
}
.nav-inner{display:flex;align-items:center;justify-content:space-between;height:74px;gap:24px;}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:700;font-size:19px;}
.logo-mark{
  width:34px;height:34px;border-radius:10px;background:var(--grad-main);
  display:flex;align-items:center;justify-content:center;font-size:16px;color:#08091a;flex:none;
  box-shadow:0 6px 16px -4px rgba(124,92,255,0.6);
}
.nav-links{display:flex;align-items:center;gap:28px;font-size:14.5px;font-weight:500;color:var(--text-dim);}
.nav-links a{transition:color .2s;white-space:nowrap;}
.nav-links a:hover, .nav-links a.active{color:var(--text);}
.nav-right{display:flex;align-items:center;gap:12px;flex:none;}
.icon-btn{
  width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  border:1px solid var(--border);background:var(--surface);font-size:16px;transition:.2s;
}
.icon-btn:hover{border-color:var(--violet);}
.nav-burger{display:none;}

@media (max-width:900px){
  .nav-links{display:none;}
  .nav-burger{display:flex;}
}

/* ---------- mobile drawer ---------- */
.mobile-drawer{
  position:fixed;inset:0;z-index:200;background:color-mix(in srgb, var(--bg) 96%, transparent);
  backdrop-filter:blur(10px);
  display:flex;flex-direction:column;padding:24px;gap:6px;
  transform:translateX(100%);transition:transform .35s ease;
}
.mobile-drawer.open{transform:translateX(0);}
.mobile-drawer a{padding:16px 6px;font-size:18px;font-weight:600;border-bottom:1px solid var(--border);}
.mobile-drawer-close{align-self:flex-end;}

/* ---------- footer ---------- */
.footer{border-top:1px solid var(--border);padding:60px 0 30px;margin-top:80px;color:var(--text-dim);}
.footer-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:32px;}
.footer h4{font-size:13px;color:var(--text);margin-bottom:14px;}
.footer ul{display:flex;flex-direction:column;gap:10px;font-size:14px;}
.footer ul a:hover{color:var(--cyan);}
.footer-bottom{margin-top:50px;padding-top:24px;border-top:1px solid var(--border);display:flex;justify-content:space-between;font-size:13px;flex-wrap:wrap;gap:10px;}
@media (max-width:760px){.footer-grid{grid-template-columns:1fr 1fr;}}

/* ---------- section helpers ---------- */
.section{padding:80px 0;}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:36px;gap:20px;flex-wrap:wrap;}
.section-title{font-size:clamp(26px,3vw,36px);font-weight:700;}
.section-sub{color:var(--text-dim);font-size:15px;margin-top:8px;max-width:540px;}
.see-all{font-size:14px;font-weight:600;color:var(--violet);display:flex;align-items:center;gap:6px;}

/* ---------- badges ---------- */
.badge{
  font-family:var(--font-mono);font-size:11px;font-weight:600;letter-spacing:.03em;
  padding:4px 10px;border-radius:999px;display:inline-flex;align-items:center;gap:5px;
}
.badge-free{background:rgba(61,220,151,0.14);color:var(--green);}
.badge-freemium{background:rgba(255,178,63,0.14);color:var(--amber);}
.badge-paid{background:rgba(255,107,91,0.14);color:var(--coral);}
.badge-new{background:rgba(124,92,255,0.16);color:var(--violet);}
.badge-trend{background:rgba(0,224,198,0.14);color:var(--cyan);}

/* ---------- tool card ---------- */
.tool-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius-md);
  padding:22px;
  display:flex;flex-direction:column;gap:14px;
  transition:transform .3s ease, box-shadow .3s ease, border-color .3s ease;
  position:relative;
  overflow:hidden;
}
.tool-card::before{
  content:'';position:absolute;inset:0;background:var(--grad-card);opacity:0;transition:opacity .3s ease;pointer-events:none;
}
.tool-card:hover{transform:translateY(-4px);border-color:var(--border-strong);box-shadow:var(--shadow-glow);}
.tool-card:hover::before{opacity:1;}
.tool-card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;position:relative;z-index:1;}
.tool-logo{
  width:50px;height:50px;border-radius:14px;display:flex;align-items:center;justify-content:center;
  font-size:22px;flex:none;font-family:var(--font-display);font-weight:700;
}
.tool-fav{background:none;border:none;color:var(--text-faint);font-size:18px;padding:4px;}
.tool-fav.active{color:var(--coral);}
.tool-name{font-size:17px;font-weight:700;margin:2px 0 2px;}
.tool-maker{font-size:12px;color:var(--text-faint);}
.tool-desc{font-size:13.5px;color:var(--text-dim);line-height:1.55;position:relative;z-index:1;}
.tool-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:relative;z-index:1;}
.tool-rating{display:flex;align-items:center;gap:4px;font-family:var(--font-mono);font-size:12.5px;color:var(--amber);}
.tool-cat-pill{font-size:11.5px;color:var(--text-faint);background:var(--surface-2);padding:3px 9px;border-radius:999px;}
.tool-tags{display:flex;flex-wrap:wrap;gap:6px;position:relative;z-index:1;}
.tool-tag{font-size:11px;color:var(--text-dim);border:1px solid var(--border);padding:3px 8px;border-radius:7px;}
.tool-card-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto;position:relative;z-index:1;}

.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;}
@media (max-width:1080px){.grid-3{grid-template-columns:repeat(2,1fr);} .grid-4{grid-template-columns:repeat(2,1fr);}}
@media (max-width:620px){.grid-3{grid-template-columns:1fr;} .grid-4{grid-template-columns:1fr;}}

/* horizontal scroller */
.hscroll{display:flex;gap:20px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x mandatory;}
.hscroll::-webkit-scrollbar{height:6px;}
.hscroll::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:4px;}
.hscroll > *{scroll-snap-align:start;flex:0 0 290px;}

/* ---------- chips / filters ---------- */
.chip-row{display:flex;gap:10px;flex-wrap:wrap;}
.chip{
  font-size:13.5px;font-weight:600;padding:9px 16px;border-radius:999px;
  border:1px solid var(--border);background:var(--surface);color:var(--text-dim);
  transition:.2s;white-space:nowrap;
}
.chip:hover{border-color:var(--violet);color:var(--text);}
.chip.active{background:var(--grad-main);color:#08091a;border-color:transparent;}

/* ---------- form controls ---------- */
.input, select.input{
  width:100%;background:var(--surface);border:1px solid var(--border);color:var(--text);
  padding:13px 16px;border-radius:var(--radius-sm);font-size:14.5px;font-family:var(--font-body);
  transition:border-color .2s;
}
.input:focus, select.input:focus{outline:none;border-color:var(--violet);}
.search-wrap{position:relative;}
.search-wrap .input{padding-left:44px;}
.search-icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--text-faint);}

/* ---------- card / panel ---------- */
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:28px;}

/* utility */
.flex{display:flex;}
.flex-col{display:flex;flex-direction:column;}
.items-center{align-items:center;}
.justify-between{justify-content:space-between;}
.gap-8{gap:8px;} .gap-12{gap:12px;} .gap-16{gap:16px;} .gap-20{gap:20px;} .gap-24{gap:24px;}
.mt-8{margin-top:8px;} .mt-16{margin-top:16px;} .mt-24{margin-top:24px;} .mt-40{margin-top:40px;}
.text-dim{color:var(--text-dim);}
.text-faint{color:var(--text-faint);}
.text-center{text-align:center;}
.hidden{display:none !important;}
.w-full{width:100%;}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.01ms !important; transition-duration:0.01ms !important;}
}

@media (max-width:760px){
  .section{padding:56px 0;}
}

/* ===================== HERO ===================== */
.hero{position:relative;padding:90px 0 70px;overflow:hidden;}
.hero-canvas-wrap{position:absolute;inset:0;z-index:0;opacity:0.9;}
.hero-canvas-wrap canvas{display:block;}
.hero-fade{position:absolute;inset:0;background:radial-gradient(60% 50% at 50% 30%, transparent, var(--bg) 85%);z-index:1;pointer-events:none;}
.hero-content{position:relative;z-index:2;text-align:center;max-width:780px;margin:0 auto;}
.hero-title{font-size:clamp(38px,6.4vw,68px);font-weight:700;line-height:1.05;margin-top:22px;}
.hero-sub{font-size:clamp(16px,2vw,19px);color:var(--text-dim);margin:22px auto 0;max-width:560px;}
.hero-actions{display:flex;gap:14px;justify-content:center;margin-top:34px;flex-wrap:wrap;}
.hero-stats{display:flex;justify-content:center;gap:48px;margin-top:56px;flex-wrap:wrap;}
.hero-stat-num{font-family:var(--font-display);font-size:28px;font-weight:700;}
.hero-stat-label{font-size:12.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.05em;}

/* ===================== CATEGORY TILES ===================== */
.cat-tile{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);
  padding:24px;display:flex;flex-direction:column;gap:10px;transition:.25s;
}
.cat-tile:hover{transform:translateY(-3px);border-color:var(--violet);}
.cat-icon{font-size:26px;}
.cat-tile .cat-name{font-weight:700;font-size:16px;}
.cat-tile .cat-count{font-size:12.5px;color:var(--text-faint);}

/* ===================== PAGE HEADER BAND ===================== */
.page-band{padding:64px 0 36px;border-bottom:1px solid var(--border);}
.page-band .eyebrow{margin-bottom:14px;}
.page-band h1{font-size:clamp(30px,4vw,46px);}
.page-band p{color:var(--text-dim);max-width:600px;margin-top:14px;font-size:15.5px;}

/* ===================== DIRECTORY ===================== */
.directory-layout{display:grid;grid-template-columns:260px 1fr;gap:36px;align-items:flex-start;}
.filters-panel{position:sticky;top:94px;}
.filter-group{margin-bottom:26px;}
.filter-group h4{font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-faint);margin-bottom:12px;}
.filter-list{display:flex;flex-direction:column;gap:10px;font-size:14px;color:var(--text-dim);}
.filter-list label{display:flex;align-items:center;gap:9px;cursor:pointer;}
.results-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;flex-wrap:wrap;gap:14px;}
.sort-select{width:auto;min-width:170px;}
@media (max-width:920px){
  .directory-layout{grid-template-columns:1fr;}
  .filters-panel{position:static;}
}

/* ===================== TOOL DETAIL ===================== */
.tool-hero{display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap;}
.tool-hero-logo{width:84px;height:84px;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:38px;flex:none;}
.detail-grid{display:grid;grid-template-columns:2fr 1fr;gap:32px;margin-top:40px;}
@media (max-width:920px){.detail-grid{grid-template-columns:1fr;}}
.feature-list li, .pros-list li, .cons-list li{
  display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);font-size:14.5px;color:var(--text-dim);
}
.feature-list li:last-child, .pros-list li:last-child, .cons-list li:last-child{border-bottom:none;}
.pros-list li::before{content:'+';color:var(--green);font-weight:700;}
.cons-list li::before{content:'–';color:var(--coral);font-weight:700;}
.feature-list li::before{content:'✦';color:var(--violet);font-size:11px;}

/* ===================== COMPARE ===================== */
.compare-table{width:100%;border-collapse:collapse;margin-top:20px;}
.compare-table th, .compare-table td{padding:16px;border-bottom:1px solid var(--border);text-align:left;font-size:14px;vertical-align:top;}
.compare-table th{font-family:var(--font-display);font-size:15px;}
.compare-table tr td:first-child, .compare-table tr th:first-child{color:var(--text-faint);font-family:var(--font-mono);font-size:12.5px;width:140px;}
.compare-picker{display:flex;gap:14px;flex-wrap:wrap;margin-top:18px;}
.compare-slot select{min-width:200px;}

/* ===================== PRICING ===================== */
.pricing-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:36px;
  position:relative;overflow:hidden;
}
.pricing-card.featured{border-color:var(--violet);box-shadow:var(--shadow-glow);}
.pricing-card.featured::before{content:'Most popular';position:absolute;top:18px;right:-34px;transform:rotate(45deg);
  background:var(--grad-main);color:#08091a;font-size:11px;font-weight:700;padding:4px 40px;}
.price-num{font-family:var(--font-display);font-size:44px;font-weight:700;margin:14px 0;}
.price-num span{font-size:16px;color:var(--text-faint);font-weight:500;}
.pricing-feat{display:flex;flex-direction:column;gap:12px;margin:24px 0;font-size:14.5px;}
.pricing-feat li{display:flex;gap:10px;color:var(--text-dim);}
.pricing-feat li::before{content:'✓';color:var(--cyan);font-weight:700;}

/* ===================== AUTH / FORMS ===================== */
.auth-shell{max-width:420px;margin:80px auto;}
.form-row{margin-bottom:16px;}
.form-row label{display:block;font-size:13px;color:var(--text-dim);margin-bottom:7px;}

/* ===================== ADMIN ===================== */
.admin-layout{display:grid;grid-template-columns:220px 1fr;gap:32px;}
.admin-side{display:flex;flex-direction:column;gap:4px;}
.admin-side a{padding:12px 14px;border-radius:10px;font-size:14px;color:var(--text-dim);font-weight:600;}
.admin-side a.active, .admin-side a:hover{background:var(--surface-2);color:var(--text);}
.admin-table{width:100%;border-collapse:collapse;}
.admin-table th,.admin-table td{padding:13px 12px;border-bottom:1px solid var(--border);font-size:13.5px;text-align:left;}
.admin-table th{color:var(--text-faint);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:22px;}
.stat-card .num{font-family:var(--font-display);font-size:30px;font-weight:700;}
@media (max-width:880px){.admin-layout{grid-template-columns:1fr;} .admin-side{flex-direction:row;overflow-x:auto;}}

/* ===================== MARQUEE / LOGO STRIP ===================== */
.logo-strip{display:flex;gap:40px;align-items:center;overflow:hidden;mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);}
.logo-strip-track{display:flex;gap:60px;animation:scroll-x 28s linear infinite;flex:none;}
@keyframes scroll-x{from{transform:translateX(0);}to{transform:translateX(-50%);}}
.logo-strip-item{font-family:var(--font-display);font-weight:700;font-size:20px;color:var(--text-faint);opacity:.7;white-space:nowrap;}

/* ===================== EMPTY STATE ===================== */
.empty-state{text-align:center;padding:60px 20px;color:var(--text-dim);}
.empty-state .ico{font-size:34px;margin-bottom:14px;}

/* ===================== CHAT ATTACH / PHOTO ===================== */
.attach-btn{
  width:44px;height:44px;border-radius:12px;border:1px solid var(--border);background:var(--surface);
  display:flex;align-items:center;justify-content:center;font-size:18px;flex:none;cursor:pointer;color:var(--text-dim);
}
.attach-btn:hover{border-color:var(--violet);color:var(--violet);}
.img-preview-row{display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
.img-preview{position:relative;width:64px;height:64px;border-radius:10px;overflow:hidden;border:1px solid var(--border);}
.img-preview img{width:100%;height:100%;object-fit:cover;display:block;}
.img-preview .remove-img{
  position:absolute;top:2px;right:2px;width:18px;height:18px;border-radius:50%;background:rgba(0,0,0,0.6);
  color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;
}
.bubble-img{max-width:220px;border-radius:10px;display:block;margin-bottom:8px;}

/* ===================== ANIMATIONS ===================== */
@keyframes fade-up{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
.reveal{animation:fade-up .6s ease both;}
</style>
<style>
  /* SPA-only tweaks */
  a[href^="#/"]{cursor:pointer;}
  .tab-link{cursor:pointer;}
</style>

<script>// AI Universe — tool dataset
// pricing: "Free" | "Freemium" | "Paid"
const TOOLS = [
  // AI Assistants

<script>// Constellation canvas — the "universe" of AI tools, connecting like stars
function initConstellation(canvasId){
    const canvas = document.getElementById(canvasId);
    if(!canvas) return;
    const ctx = canvas.getContext('2d');
    let w,h, points=[];
    const NAMES = ["GPT","Claude","Gemini","Midjourney","Runway","Copilot","Notion","Canva","Cursor","Jasper","Perplexity","Leonardo"];

    function resize(){
      w = canvas.parentElement.offsetWidth;
      h = canvas.parentElement.offsetHeight;
      canvas.width = w * devicePixelRatio;
      canvas.height = h * devicePixelRatio;
      canvas.style.width = w+'px';
      canvas.style.height = h+'px';
      ctx.scale(devicePixelRatio, devicePixelRatio);
      buildPoints();
    }
    function buildPoints(){
      points = [];
      const count = Math.max(18, Math.floor((w*h)/26000));
      for(let i=0;i<count;i++){
        points.push({
          x: Math.random()*w, y: Math.random()*h,
          vx:(Math.random()-0.5)*0.18, vy:(Math.random()-0.5)*0.18,
          r: Math.random()*1.6+0.8,
          label: Math.random()<0.16 ? NAMES[Math.floor(Math.random()*NAMES.length)] : null
        });
      }
    }
    let mouse = {x:-9999,y:-9999};
    canvas.parentElement.addEventListener('mousemove', e=>{
      const rect = canvas.getBoundingClientRect();
      mouse.x = e.clientX - rect.left; mouse.y = e.clientY - rect.top;
    });
    canvas.parentElement.addEventListener('mouseleave', ()=>{ mouse.x=-9999; mouse.y=-9999; });

    const isDark = ()=> document.documentElement.getAttribute('data-theme') !== 'light';

    function draw(){
      ctx.clearRect(0,0,w,h);
      const dotColor = isDark() ? 'rgba(180,190,255,0.85)' : 'rgba(90,80,180,0.6)';
      const lineColorBase = isDark() ? [124,92,255] : [124,92,255];

      points.forEach(p=>{
        p.x += p.vx; p.y += p.vy;
        if(p.x<0||p.x>w) p.vx*=-1;
        if(p.y<0||p.y>h) p.vy*=-1;
        const dx = p.x-mouse.x, dy = p.y-mouse.y;
        const dist = Math.sqrt(dx*dx+dy*dy);
        if(dist<120){ p.x += dx/dist*0.6; p.y += dy/dist*0.6; }
      });

      for(let i=0;i<points.length;i++){
        for(let j=i+1;j<points.length;j++){
          const a=points[i], b=points[j];
          const d = Math.hypot(a.x-b.x, a.y-b.y);
          if(d<150){
            const op = (1-d/150) * 0.5;
            ctx.strokeStyle = `rgba(${lineColorBase[0]},${lineColorBase[1]},${lineColorBase[2]},${op*0.5})`;
            ctx.lineWidth=1;
            ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
          }
        }
      }
      points.forEach(p=>{
        ctx.beginPath();
        ctx.fillStyle = dotColor;
        ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
        ctx.fill();
        if(p.label){
          ctx.font = '11px "JetBrains Mono", monospace';
          ctx.fillStyle = isDark() ? 'rgba(0,224,198,0.55)' : 'rgba(124,92,255,0.55)';
          ctx.fillText(p.label, p.x+8, p.y+3);
        }
      });
      requestAnimationFrame(draw);
    }
    window.addEventListener('resize', resize);
    resize();
    draw();
}
</script>

/* ---------- theme ---------- */
const Theme = {
  init(){
    const saved = localStorage.getItem('au_theme') || 'dark';
    document.documentElement.setAttribute('data-theme', saved);
  },
  toggle(){
    const cur = document.documentElement.getAttribute('data-theme');
    const next = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('au_theme', next);
    document.querySelectorAll('.theme-toggle').forEach(b=> b.textContent = next==='dark'?'☾':'☀');
  }
};

/* ---------- favorites / recents / auth ---------- */
const Favorites = {
  key:'au_favorites',
  get(){ return JSON.parse(localStorage.getItem(this.key) || '[]'); },
  has(id){ return this.get().includes(id); },
  toggle(id){
    let list = this.get();
    if(list.includes(id)) list = list.filter(x=>x!==id); else list.push(id);
    localStorage.setItem(this.key, JSON.stringify(list));
    return list.includes(id);
  }
};
const RecentlyViewed = {
  key:'au_recent',
  get(){ return JSON.parse(localStorage.getItem(this.key) || '[]'); },
  add(id){ let l=this.get().filter(x=>x!==id); l.unshift(id); localStorage.setItem(this.key, JSON.stringify(l.slice(0,12))); }
};
const Auth = {
  key:'au_user',
  get(){ return JSON.parse(localStorage.getItem(this.key) || 'null'); },
  login(name,email){ const u={name,email,premium:false,joined:new Date().toISOString().slice(0,10)}; localStorage.setItem(this.key, JSON.stringify(u)); return u; },

      const mc = state.cats.length===0 || state.cats.includes(t.category);
      const mp = state.prices.length===0 || state.prices.includes(t.pricing);
      const mr = t.rating >= state.minRating;
      const mn = !state.onlyNew || t.new;
      return mq&&mc&&mp&&mr&&mn;
    });
    if(state.sort==='rating') list.sort((a,b)=>b.rating-a.rating);
    if(state.sort==='name') list.sort((a,b)=>a.name.localeCompare(b.name));
    if(state.sort==='reviews') list.sort((a,b)=>b.reviews-a.reviews);

function afterCompare(qp){
  const sorted = [...TOOLS].sort((a,b)=>a.name.localeCompare(b.name));
  function fill(sel, def){ sel.innerHTML = `<option value="">— choose a tool —</option>` + sorted.map(t=>`<option value="${t.id}" ${t.id===def?'selected':''}>${t.name}</option>`).join(''); }
  const slotA=document.getElementById('slotA'), slotB=document.getElementById('slotB'), slotC=document.getElementById('slotC');
  fill(slotA, qp.get('a')||'chatgpt'); fill(slotB, qp.get('b')||'claude'); fill(slotC, qp.get('c')||'gemini');
  function row(label,cells){ return `<tr><td>${label}</td>${cells.map(c=>`<td>${c}</td>`).join('')}</tr>`; }
  function render(){
    const ids=[slotA.value,slotB.value,slotC.value].filter(Boolean);
    const tools = ids.map(toolById).filter(Boolean);
    const table = document.getElementById('compareTable');
    if(tools.length<1){ table.innerHTML = `<tr><td>Pick at least one tool above to begin comparing.</td></tr>`; return; }

      ${row('Strengths', tools.map(t=>`<ul class="pros-list">${t.pros.map(f=>`<li>${f}</li>`).join('')}</ul>`))}
      ${row('Watch out for', tools.map(t=>`<ul class="cons-list">${t.cons.map(f=>`<li>${f}</li>`).join('')}</ul>`))}
      ${row('Details', tools.map(t=>`<a class="btn btn-ghost btn-sm" href="#/tool?id=${t.id}">View page →</a>`))}

function afterAdmin(){
  const STORE_KEY='au_admin_tools', CAT_KEY='au_admin_cats';
  let extraTools = JSON.parse(localStorage.getItem(STORE_KEY)||'[]');
  let removedIds = JSON.parse(localStorage.getItem('au_admin_removed')||'[]');
  let extraCats = JSON.parse(localStorage.getItem(CAT_KEY)||'[]');
  function allTools(){ return [...TOOLS.filter(t=>!removedIds.includes(t.id)), ...extraTools]; }
  function allCats(){ return [...CATEGORIES, ...extraCats]; }
  function save(){ localStorage.setItem(STORE_KEY, JSON.stringify(extraTools)); localStorage.setItem('au_admin_removed', JSON.stringify(removedIds)); localStorage.setItem(CAT_KEY, JSON.stringify(extraCats)); }

  document.querySelectorAll('.tab-link').forEach(link=>{
    link.addEventListener('click', ()=>{
      document.querySelectorAll('.tab-link').forEach(l=>l.classList.remove('active'));
      link.classList.add('active');
      document.querySelectorAll('.tab-panel').forEach(p=>p.classList.add('hidden'));
      document.getElementById('panel-'+link.dataset.tab).classList.remove('hidden');
    });
  });
  function renderOverview(){
    const ts = allTools();
    document.getElementById('statTools').textContent = ts.length;
    document.getElementById('statCats').textContent = allCats().length;
    document.getElementById('statUsers').textContent = Auth.get() ? 1 : 0;
    document.getElementById('statAvgRating').textContent = (ts.reduce((s,t)=>s+t.rating,0)/ts.length || 0).toFixed(2);
  }
  function renderTools(){
    const ts = allTools();
    document.getElementById('toolsTable').innerHTML = `<tr><th>Tool</th><th>Category</th><th>Pricing</th><th>Rating</th><th></th></tr>
      ${ts.map(t=>`<tr><td>${t.logo} ${t.name}</td><td>${t.category}</td><td>${t.pricing}</td><td>${t.rating.toFixed(1)}★</td><td><button class="btn btn-ghost btn-sm" data-remove="${t.id}">Remove</button></td></tr>`).join('')}`;
    document.querySelectorAll('[data-remove]').forEach(btn=>btn.addEventListener('click', ()=>{
      const id = btn.dataset.remove;
      if(extraTools.find(t=>t.id===id)) extraTools = extraTools.filter(t=>t.id!==id); else removedIds.push(id);
      save(); renderAll();
    }));
  }
  function renderCats(){
    document.getElementById('catAdminGrid').innerHTML = allCats().map(c=>`<div class="panel"><div class="cat-icon">${c.icon}</div><div class="cat-name mt-8">${c.name}</div><div class="text-faint" style="font-size:12.5px;">${c.desc}</div></div>`).join('');
  }
  function renderUsers(){
    const u = Auth.get();
    document.getElementById('usersTable').innerHTML = `<tr><th>Name</th><th>Email</th><th>Plan</th><th>Joined</th></tr>
      ${u ? `<tr><td>${u.name}</td><td>${u.email}</td><td>${u.premium?'Premium':'Free'}</td><td>${u.joined}</td></tr>` : `<tr><td colspan="4" class="text-faint">No user signed in on this browser yet.</td></tr>`}`;
  }
  function renderAll(){ renderOverview(); renderTools(); renderCats(); renderUsers(); }
  document.getElementById('addToolBtn').addEventListener('click', ()=>{
    const name = prompt('Tool name?'); if(!name) return;
    const category = prompt('Category?') || 'Writing';
    const blurb = prompt('Short description?') || 'A new AI tool.';
    const pricing = prompt('Pricing — Free, Freemium or Paid?') || 'Freemium';
    const id = name.toLowerCase().replace(/[^a-z0-9]/g,'') + '-' + Date.now().toString(36).slice(-4);
    extraTools.push({ id,name,maker:'Unknown',category,tags:[],logo:name[0].toUpperCase(),color:'#7c5cff',rating:4.0,reviews:0,pricing,
      priceFrom: pricing==='Free'?'Free':'Contact for pricing', blurb, who:'Newly added — details coming soon.', features:['Details coming soon'],
      pros:['Newly added'], cons:['Not yet reviewed'], alternatives:[], new:true, trending:false, weekly:false });
    save(); renderAll();
  });
  document.getElementById('addCatBtn').addEventListener('click', ()=>{
    const name = prompt('Category name?'); if(!name) return;
    const icon = prompt('Emoji icon?') || '✦';
    const desc = prompt('Short description?') || '';
    extraCats.push({name,icon,desc}); save(); renderAll();
  });
  renderAll();
}

// Normalizes common natural-language math phrasing into something math.js can parse.
function normalizeMathText(text){
  return text
    .replace(/×/g,'*').replace(/÷/g,'/').replace(/²/g,'^2').replace(/³/g,'^3')
    .replace(/\bsquare root of\b/gi,'sqrt')
    .replace(/\bsquared\b/gi,'^2')
    .replace(/\bcubed\b/gi,'^3')
    .replace(/\bplus\b/gi,'+').replace(/\bminus\b/gi,'-')
    .replace(/\btimes\b/gi,'*').replace(/\bdivided by\b/gi,'/')
    .trim();
}

// Numerically fits a polynomial of given degree (1 = linear, 2 = quadratic) to an
// expression of x by sampling it at degree+1 points, then solves it exactly.
// This lets us solve any linear or quadratic equation without a symbolic CAS.
function solveEquation(lhsExpr, rhsExpr){
  const f = x => math.evaluate(`(${lhsExpr})-(${rhsExpr})`, {x});
  const samples = [-1,0,1,2].map(x => ({x, y:f(x)}));
  // Try linear first: y = a*x + b
  const a1 = samples[2].y - samples[1].y; // f(1)-f(0)
  const b1 = samples[1].y; // f(0)
  const isLinear = Math.abs((samples[3].y - samples[2].y) - a1) < 1e-9; // constant slope check
  if(isLinear){
    if(Math.abs(a1) < 1e-12) return null;
    const root = -b1/a1;
    return { type:'linear', roots:[round6(root)] };
  }
  // Fit quadratic y = a*x^2 + b*x + c using f(-1), f(0), f(1)
  const fm1=samples[0].y, f0=samples[1].y, f1=samples[2].y;
  const a = (fm1 + f1)/2 - f0;
  const b = (f1 - fm1)/2;
  const c = f0;
  if(Math.abs(a) < 1e-12) return null; // not actually quadratic, give up gracefully
  const disc = b*b - 4*a*c;
  if(disc < 0){
    const re = round6(-b/(2*a)), im = round6(Math.sqrt(-disc)/(2*a));
    return { type:'quadratic-complex', roots:[`${re} + ${im}i`, `${re} - ${im}i`] };
  }
  const sq = Math.sqrt(disc);
  return { type:'quadratic', roots:[round6((-b+sq)/(2*a)), round6((-b-sq)/(2*a))] };
}
function round6(n){ return Math.round(n*1e6)/1e6; }

// Solves math problems for real, using math.js (a genuine math engine — exact
// computation, not a guess): plain arithmetic, equations with one variable
// (linear or quadratic), derivatives, and algebraic simplification.
function solveMathProblem(rawText){
  const text = normalizeMathText(rawText);
  try{
    // Derivative requests: "derivative of x^2+3x", "differentiate sin(x)"
    const derivMatch = text.match(/(?:derivative of|differentiate)\s+(.+)/i);
    if(derivMatch){
      const expr = derivMatch[1].replace(/\?+$/,'').trim();
      const result = math.derivative(expr, 'x').toString();
      return `The derivative of ${expr} with respect to x is:\n\nd/dx [${expr}] = ${result}`;
    }
    // Simplify / factor / expand requests
    const simpMatch = text.match(/(?:simplify|factor|expand)\s+(.+)/i);
    if(simpMatch){
      const expr = simpMatch[1].replace(/\?+$/,'').trim();
      const result = math.simplify(expr).toString();
      return `Simplified:\n\n${expr} = ${result}`;
    }
    // Equation with an x (or X) variable: solve for x
    if(/=/.test(text) && /[xX]/.test(text)){
      const [lhsRaw, rhsRaw] = text.split('=');
      const lhs = lhsRaw.replace(/[xX]/g,'x').replace(/solve(\s+for\s+x)?:?/i,'').trim();
      const rhs = rhsRaw.replace(/[xX]/g,'x').replace(/\?+$/,'').trim();
      const solved = solveEquation(lhs, rhs);
      if(solved && solved.roots.length===1) return `Solving ${lhs} = ${rhs} for x:\n\nx = ${solved.roots[0]}`;
      if(solved && solved.roots.length===2) return `Solving ${lhs} = ${rhs} for x (quadratic):\n\nx = ${solved.roots[0]}  or  x = ${solved.roots[1]}`;
      // fall through to plain evaluation attempt below if equation solving didn't apply
    }
    // Plain expression / arithmetic, including sqrt, trig, logs, percentages, etc.
    const exprMatch = text.match(/(?:solve|calculate|compute|evaluate|what is|what's)?\s*:?\s*(.+)/i);
    const expr = (exprMatch ? exprMatch[1] : text).replace(/\?+$/,'').trim();
    const value = math.evaluate(expr);
    const formatted = (typeof value === 'number') ? math.format(value, {precision:10}) : value.toString();
    return `${expr} = ${formatted}`;
  } catch(err){
    return null; // signals "couldn't solve" so caller can fall back gracefully
  }
}

function looksLikeMath(q){
  const hasMathChars = /[0-9].*[+\-*/^=].*[0-9]|sqrt|derivative|integral|sin\(|cos\(|tan\(|log\(/i.test(q);
  const isWordProblem = /\b(train|apples|cost|age|miles|hours|workers|tank|speed of (a|the) (car|train))\b/i.test(q) && !/^[0-9x+\-*/^=().\s]+$/.test(q);
  return hasMathChars && !isWordProblem;
}
function trySolveMath(q){
  try{
    let expr = q.replace(/\?+$/,'').trim();
    // "solve 2x+3=7" or "solve for x: 2x+3=7"
    const eqMatch = expr.match(/(?:solve(?: for [a-z])?:?\s*)?([^=]+)=([^=]+)$/i);
    if(/solve/i.test(expr) && eqMatch){
      const lhs = eqMatch[1].trim(), rhs = eqMatch[2].trim();
      const variable = (expr.match(/[a-z]/i) || ['x'])[0];
      // bisection-free symbolic solve via math.js algebra isn't built in, so use math.js's
      // simplify + a basic linear solver for ax+b=c forms, which covers most "easy" algebra.
      const node = math.parse(`(${lhs}) - (${rhs})`);
      const simplified = math.simplify(node).toString();
      // try simple numeric root-finding for the single-variable equation over a wide range
      const f = (x)=> math.evaluate(simplified, {[variable]: x});
      let root = null;
      for(let x=-1000; x<=1000; x+=0.5){
        try{
          const y1=f(x), y2=f(x+0.5);
          if(isFinite(y1) && isFinite(y2) && y1*y2<=0){
            // refine with a few bisection steps
            let lo=x, hi=x+0.5;
            for(let i=0;i<40;i++){
              const mid=(lo+hi)/2;
              if(f(lo)*f(mid)<=0) hi=mid; else lo=mid;
            }
            root = (lo+hi)/2;
            break;
          }
        } catch(e){}
      }
      if(root!==null){
        return { text: `${variable} = ${math.round(root,6)}\n\n(solved ${simplified} = 0)`, link: null };
      }
    }
    // direct evaluation: "12*7+3", "sqrt(144)", "derivative of x^3", "integrate 2x"
    const derivMatch = expr.match(/derivative of (.+)/i);
    if(derivMatch){
      const result = math.derivative(derivMatch[1], 'x').toString();
      return { text: `d/dx[${derivMatch[1]}] = ${result}`, link: null };
    }
    const result = math.evaluate(expr);
    if(result !== undefined && typeof result !== 'function'){
      return { text: `${expr} = ${math.format(result, {precision:10})}`, link: null };
    }
  } catch(e){ /* not a clean math expression — fall through to other lookups */ }
  return null;
}

// ---- Chemistry lookups via PubChem (free, keyless) ----
async function tryChemistry(q){
  const m = q.match(/\b(molar mass|molecular weight|formula|structure)\s+(?:of\s+)?([a-z0-9\s]+)/i);
  if(!m) return null;
  const compound = m[2].trim();
  try{
    const res = await fetch(`https://pubchem.ncbi.nlm.nih.gov/rest/pug/compound/name/${encodeURIComponent(compound)}/property/MolecularFormula,MolecularWeight,IUPACName/JSON`);
    if(!res.ok) return null;
    const data = await res.json();
    const props = data?.PropertyTable?.Properties?.[0];
    if(!props) return null;
    return {
      text: `${compound}: formula ${props.MolecularFormula}, molecular weight ${props.MolecularWeight} g/mol${props.IUPACName ? `, IUPAC name: ${props.IUPACName}` : ''}`,
      link: `https://pubchem.ncbi.nlm.nih.gov/#query=${encodeURIComponent(compound)}`
    };
  } catch(e){ return null; }
}

// Real symbolic math solving — runs entirely in the browser via nerdamer/mathjs.
// Handles arithmetic, algebraic simplification, linear/quadratic equations,
// derivatives and integrals. Free, keyless, no AI guessing involved — these
// are exact computed results. Returns null if the input isn't math it can parse.
function solveMath(raw){
  const q = raw.trim();
  try{
    // Derivative: "derivative of x^2", "differentiate sin(x)", "d/dx x^3"
    let m = q.match(/(?:derivative of|differentiate)\s+(.+)/i) || q.match(/d\/dx\s*\(?(.+?)\)?$/i);
    if(m){
      const result = nerdamer.diff(m[1].trim()).toString();
      return `The derivative is:\n\n${m[1].trim()} → ${result}`;
    }
    // Integral: "integral of x^2", "integrate cos(x)"
    m = q.match(/(?:integral of|integrate)\s+(.+)/i);
    if(m){
      const result = nerdamer.integrate(m[1].trim()).toString();
      return `The integral is:\n\n∫ ${m[1].trim()} dx = ${result} + C`;
    }
    // Equation solving: contains "=" and a variable, e.g. "2x + 3 = 7" or "solve x^2-4=0"
    m = q.match(/(?:solve)?\s*([^=]+=[^=]+)/i);
    if(m && /=/.test(m[1]) && /[a-z]/i.test(m[1])){
      const eqn = m[1].replace(/solve/i,'').trim();
      const varMatch = eqn.match(/[a-z]/i);
      const variable = varMatch ? varMatch[0] : 'x';
      const solutions = nerdamer.solveEquations(eqn, variable);
      const list = Array.isArray(solutions) ? solutions.map(s=>s.toString()) : [solutions.toString()];
      return `Solving ${eqn} for ${variable}:\n\n${variable} = ${list.join('  or  ')}`;
    }
    // Simplify / factor request
    m = q.match(/(?:simplify|factor)\s+(.+)/i);
    if(m){
      const fn = /factor/i.test(q) ? 'factor' : 'expand';
      const result = nerdamer(m[1].trim())[fn]().toString();
      return `Result:\n\n${m[1].trim()} = ${result}`;
    }
    // Plain arithmetic/algebraic expression — try direct evaluation
    const cleaned = q.replace(/^(what is|what's|calculate|compute|evaluate)\s+/i,'').replace(/\?+$/,'').trim();
    const evaluated = math.evaluate(cleaned);
    if(evaluated !== undefined && typeof evaluated !== 'function'){
      return `${cleaned} = ${evaluated}`;
    }
  } catch(e){
    try{
      // Fallback to nerdamer for algebraic simplification if mathjs failed
      const cleaned = q.replace(/^(what is|what's|calculate|compute|evaluate)\s+/i,'').replace(/\?+$/,'').trim();
      const result = nerdamer(cleaned).evaluate().toString();
      return `${cleaned} = ${result}`;
    } catch(e2){ return null; }
  }
  return null;
}


// Strips filler words so "what is the capital of France" -> "capital of France"
// for a cleaner Wikipedia/DuckDuckGo lookup.
function extractSearchTerm(q){
  return q.replace(/^(what is|what are|who is|who was|who are|tell me about|explain|define|what's|how does|how do|why is|why does)\s+/i,'')
           .replace(/\?+$/,'').trim() || q;
}

async function tryWikipedia(term){
  const search = await fetch('https://en.wikipedia.org/w/api.php?action=opensearch&limit=1&namespace=0&format=json&search=' + encodeURIComponent(term));
  if(!search.ok) return null;
  const [, titles] = await search.json();
  if(!titles || !titles.length) return null;
  const summaryRes = await fetch('https://en.wikipedia.org/api/rest_v1/page/summary/' + encodeURIComponent(titles[0]));
  if(!summaryRes.ok) return null;
  const data = await summaryRes.json();
  if(!data.extract) return null;
  return { text: data.extract, link: data.content_urls?.desktop?.page || googleSearchUrl(term) };
}

async function tryDuckDuckGo(term){
  const res = await fetch('https://api.duckduckgo.com/?format=json&no_html=1&skip_disambig=1&q=' + encodeURIComponent(term));
  if(!res.ok) return null;
  const data = await res.json();
  const text = data.AbstractText || data.Answer || (data.RelatedTopics && data.RelatedTopics[0] && data.RelatedTopics[0].Text);
  if(!text) return null;
  return { text, link: data.AbstractURL || googleSearchUrl(term) };
}

// Free, keyless lookup chain: Wikipedia first (best for factual/topic questions),
// then DuckDuckGo Instant Answers, then a plain Google-search link as last resort.
// No backend, no API key, no cost — but quality is limited to what these two
// free public endpoints can answer (facts/definitions, not open-ended reasoning).
async function freeWebAnswer(question){
  if(looksLikeMath(question)){
    const mathResult = trySolveMath(question);
    if(mathResult) return mathResult;
  }
  const chem = await tryChemistry(question);
  if(chem) return chem;
  const term = extractSearchTerm(question);
  try{
    const wiki = await tryWikipedia(term);
    if(wiki) return wiki;
  } catch(e){ /* ignore and fall through */ }
  try{
    const ddg = await tryDuckDuckGo(term);
    if(ddg) return ddg;
  } catch(e){ /* ignore and fall through */ }
  return {
    text: "I couldn't find a quick factual answer for that with the free tools. Tap below to see full results on Google.",
    link: googleSearchUrl(question)
  };
}

// Format assistant response — converts markdown-like text to styled HTML
function formatResponse(text, role){
  if(!text) return '';
  let html = text
    // fenced code blocks ```lang\n...\n```
    .replace(/```(\w*)\n?([\s\S]*?)```/g, (_,lang,code)=>`<pre><code>${code.replace(/</g,'&lt;')}</code></pre>`)
    // inline `code`
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    // **bold**
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    // step lines "Step 1:" or "1."
    .replace(/^(Step\s*\d+[:.][^\n]*)/gm, '<div class="step">$1</div>')
    // Formula lines starting with ▶ or →
    .replace(/^[▶→]\s*(.+)$/gm, '<div class="formula">→ $1</div>')
    // Final answer box
    .replace(/^(Answer:|Final Answer:|Result:)\s*(.+)$/gim, '<div class="result-box">✓ $2</div>')
    // line breaks
    .replace(/\n/g,'<br>');
  return html;
}

  // ── Math engine (instant) ──
  function isMathQ(q){
    return /([0-9]\s*[\+\-\*\/\^]\s*[0-9])|(\b(solve|simplify|factor|derivative|differentiate|integrate|integral|calculate|expand)\b.*[a-z0-9])|([a-z]\s*\^\s*[0-9])|\b(sin|cos|tan|log|ln|sqrt|lim)\s*[\(\s]/i.test(q);
  }
  function localMath(raw){
    const q = raw.trim();
    try{
      let m = q.match(/(?:derivative of|differentiate|d\/dx\s*\(?)\s*(.+?)[\)?]?\s*$/i);
      if(m){ const r=math.derivative(m[1].trim(),'x').toString(); return `d/dx [${m[1].trim()}] = **${r}**`; }
      m = q.match(/(?:integral of|integrate)\s+(.+?)(?:\s+dx|$)/i);
      if(m && typeof nerdamer!=='undefined'){ const r=nerdamer.integrate(m[1].trim(),'x').toString(); return `∫ ${m[1].trim()} dx = **${r} + C**`; }
      m = q.match(/(?:solve(?:\s+for\s+\w)?:?\s*)?(.+?)\s*=\s*(.+)/i);
      if(m && /[a-z]/i.test(m[0]) && !/^(what|who|when|why|how|where|is|are)/i.test(q)){
        const eq=`${m[1].trim()}=${m[2].trim()}`; const v=(m[1]+m[2]).match(/[a-z]/i)?.[0]||'x';
        if(typeof nerdamer!=='undefined'){ const sols=nerdamer.solveEquations(eq,v); const list=Array.isArray(sols)?sols.map(s=>s.toString()):[sols.toString()]; return `Solving **${eq}** for **${v}**:\n\nAnswer: **${v} = ${list.join(' or ')}**`; }
      }
      m = q.match(/^(simplify|factor|expand)\s+(.+)/i);
      if(m && typeof nerdamer!=='undefined'){ const op=m[1].toLowerCase(); const expr=m[2].trim(); const r=op==='factor'?nerdamer(expr).factor().toString():op==='expand'?nerdamer(expr).expand().toString():math.simplify(expr).toString(); return `${op}(${expr}) = **${r}**`; }
      const cleaned = q.replace(/^(what is|calculate|compute|evaluate|find)\s+/i,'').replace(/\?$/,'').trim();
      const result = math.evaluate(cleaned);
      if(result!==undefined && typeof result!=='function'){ return `**${cleaned}** = **${math.format(result,{precision:10})}**`; }
    } catch(e){
      try{ if(typeof nerdamer!=='undefined'){ const c=q.replace(/^(what is|calculate)\s+/i,'').replace(/\?$/,'').trim(); return `**${c}** = **${nerdamer(c).evaluate().toString()}**`; } } catch(e2){}
    }
    return null;
  }

  // ── PubChem ──
  async function chemLookup(q){
    const m=q.match(/\b(?:molar mass|molecular weight|formula|structure)\s+(?:of\s+)?([a-z][a-z0-9\s]{1,40})/i);
    if(!m) return null;
    try{
      const r=await fetch(`https://pubchem.ncbi.nlm.nih.gov/rest/pug/compound/name/${encodeURIComponent(m[1].trim())}/property/MolecularFormula,MolecularWeight,IUPACName/JSON`);
      if(!r.ok) return null;
      const d=await r.json(); const p=d?.PropertyTable?.Properties?.[0];
      if(!p) return null;
      return { text:`**${m[1].trim()}**\n\n- Formula: **${p.MolecularFormula}**\n- Molar mass: **${p.MolecularWeight} g/mol**${p.IUPACName?'\n- IUPAC name: '+p.IUPACName:''}`, link:`https://pubchem.ncbi.nlm.nih.gov/#query=${encodeURIComponent(m[1].trim())}` };
    } catch(e){ return null; }
  }

  // ── Wikipedia ──
  async function wikiLookup(q){
    const term=q.replace(/^(what is|what are|who is|who was|explain|define|describe)\s+/i,'').replace(/\?+$/,'').trim();
    try{
      const sr=await fetch(`https://en.wikipedia.org/w/api.php?action=opensearch&limit=1&namespace=0&format=json&search=${encodeURIComponent(term)}`);
      if(!sr.ok) return null;
      const [,titles]=await sr.json();
      if(!titles?.length) return null;
      const pr=await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(titles[0])}`);
      if(!pr.ok) return null;
      const d=await pr.json();
      if(!d.extract) return null;
      const sents=(d.extract.match(/[^.!?]+[.!?]+/g)||[]).slice(0,4).join(' ');
      return { text:sents, link:d.content_urls?.desktop?.page };
    } catch(e){ return null; }
  }

  // ── DuckDuckGo ──
  async function ddgLookup(q){
    try{
      const r=await fetch(`https://api.duckduckgo.com/?format=json&no_html=1&skip_disambig=1&q=${encodeURIComponent(q)}`);
      if(!r.ok) return null;
      const d=await r.json();
      const text=d.AbstractText||d.Answer||d.RelatedTopics?.[0]?.Text;
      if(!text) return null;
      return { text, link:d.AbstractURL||null };
    } catch(e){ return null; }
  }

  // ── Format AI response ──
  function formatAI(text){
    let o=text;
    o=o.replace(/```(\w*)\n?([\s\S]*?)```/g,(_,lang,code)=>`<pre><code>${code.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}</code></pre>`);
    o=o.replace(/`([^`\n]+)`/g,'<code>$1</code>');
    o=o.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
    o=o.replace(/\*([^*\n]+)\*/g,'<em>$1</em>');
    o=o.replace(/(Step\s*\d+[:.][^\n<]*)/g,'<div class="step">$1</div>');
    o=o.replace(/^(Answer:|Final Answer:|Result:|∴[^\n]*)/gim,'<div class="ans">$1</div>');
    o=o.replace(/^### (.+)$/gm,'<h3>$1</h3>');
    o=o.replace(/^## (.+)$/gm,'<h3>$1</h3>');
    o=o.replace(/^[•\-\*] (.+)$/gm,'<li>$1</li>');
    o=o.replace(/(<li>[\s\S]*?<\/li>)/g,m=>'<ul>'+m+'</ul>');
    o=o.replace(/<\/ul>\s*<ul>/g,'');
    o=o.replace(/\n/g,'<br>');
    o=o.replace(/<br>\s*(<\/(div|ul|ol|pre|h3)>)/g,'$1');
    o=o.replace(/(<(div|ul|pre|h3)[^>]*>)\s*<br>/g,'$1');
    return o;
  }

  // ── Render chat ──
  function renderChat(){
    const win=document.getElementById('omniChat');
    if(!win) return;
    win.innerHTML=history.map(m=>{
      const isUser=m.role==='user';
      const imgs=(m.images||[]).map(s=>`<img src="${s}" style="max-width:100%;border-radius:9px;display:block;margin-bottom:8px;">`).join('');
      const modeTag=(!isUser&&m.mode&&m.mode!=='general')?`<div class="os-mode-tag">${{jee:'🎓 JEE',coding:'💻 Code',math:'🔢 Math',knowledge:'📚 Knowledge',image:'🖼️ Image'}[m.mode]||''}</div><br>`:'';
      const body=isUser?`<span>${(m.text||'').replace(/</g,'&lt;')}</span>`:`${modeTag}${formatAI(m.text||'')}`;
      const link=m.link?`<a class="os-source" href="${m.link}" target="_blank" rel="noopener">🔗 View source</a>`:'';
      const t=m.time||'';
      if(isUser) return `<div class="os-msg user"><div class="os-bubble">${imgs}${body}</div><div class="os-time">${t}</div></div>`;
      return `<div class="os-msg ai"><div class="os-avatar">🧠</div><div class="os-bubble">${imgs}${body}${link}</div><div class="os-time">${t}</div></div>`;
    }).join('');
    win.scrollTop=win.scrollHeight;
  }

  function timeNow(){ return new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}); }

  function showTyping(label){
    const win=document.getElementById('omniChat');
    if(!win) return;
    win.insertAdjacentHTML('beforeend',`<div class="os-msg ai" id="osTyping"><div class="os-avatar">🧠</div><div class="os-bubble os-typing"><span style="font-size:12px;color:var(--text-faint);margin-right:6px;">${label}</span><div class="os-dot"></div><div class="os-dot"></div><div class="os-dot"></div></div></div>`);
    win.scrollTop=win.scrollHeight;
  }
  function removeTyping(){ document.getElementById('osTyping')?.remove(); }

  // ── Suggestions ──
  function renderSuggestions(){
    const grid=document.getElementById('omniSuggestions');
    if(!grid) return;
    const list=MODE_SUGGESTIONS[currentMode]||[];
    grid.innerHTML=list.filter(([cat])=>cat).map(([cat,text])=>`<button class="ow-card" onclick="omniQuickSend(${JSON.stringify(text)})"><strong>${cat}</strong>${text}</button>`).join('');
  }
  window.omniQuickSend=function(text){ document.getElementById('omniTextInput').value=text; omniSend(); };

  // ── Mode switching ──
  function switchMode(mode){
    currentMode=mode;
    document.querySelectorAll('.os-mode').forEach(b=>b.classList.toggle('active', b.dataset.mode===mode));
    document.getElementById('omniModeTitle').textContent=MODE_TITLES[mode]||mode;
    document.getElementById('omniModeHint').textContent=MODE_HINTS[mode]||'';
    const ti=document.getElementById('omniTextInput');
    if(ti) ti.placeholder=MODE_PLACEHOLDERS[mode]||'Ask anything…';
    const isChat = !['prompt','memory'].includes(mode);
    document.getElementById('omniPromptPanel').style.display=mode==='prompt'?'flex':'none';
    document.getElementById('omniMemPanel').style.display=mode==='memory'?'flex':'none';
    document.getElementById('omniInputBar').style.display=isChat?'block':'none';
    if(isChat){
      // Reset to welcome if switching to new chat mode
      history=[];
      document.getElementById('omniChat').style.display='none';
      document.getElementById('omniWelcome').style.display='flex';
      renderSuggestions();
    } else {
      document.getElementById('omniChat').style.display='none';
      document.getElementById('omniWelcome').style.display='none';
    }
    // Mobile: close sidebar
    document.getElementById('omniSidebar').classList.remove('open');
  }

  document.querySelectorAll('.os-mode').forEach(btn=>{
    btn.addEventListener('click',()=>switchMode(btn.dataset.mode));
  });

  // ── Image handling ──
  function renderImagePreviews(){
    const row=document.getElementById('omniImgPreview');
    if(!row) return;
    row.innerHTML=pendingImages.map((img,i)=>`<div class="omni-thumb"><img src="${img.dataUrl}" alt=""><button onclick="omniRemoveImg(${i})">✕</button></div>`).join('');
    row.style.display=pendingImages.length?'flex':'none';
  }
  window.omniRemoveImg=function(i){ pendingImages.splice(i,1); renderImagePreviews(); };
  document.getElementById('omniFileInput').addEventListener('change',e=>{
    [...e.target.files].forEach(f=>{
      if(!f.type.startsWith('image/')) return;
      const r=new FileReader();
      r.onload=ev=>{ pendingImages.push({dataUrl:ev.target.result,name:f.name}); renderImagePreviews(); };
      r.readAsDataURL(f);
    });
    e.target.value='';
  });

  // ── Auto-resize textarea ──
  const ti=document.getElementById('omniTextInput');
  ti.addEventListener('input',()=>{ ti.style.height='22px'; ti.style.height=Math.min(ti.scrollHeight,130)+'px'; });
  ti.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); omniSend(); } });
  document.getElementById('omniSendBtn').addEventListener('click', omniSend);

  // ── OCR ──
  async function doOCR(dataUrl){
    if(typeof Tesseract==='undefined') return null;
    try{ const r=await Tesseract.recognize(dataUrl,'eng',{logger:()=>{}}); return r.data.text?.trim()||null; } catch(e){ return null; }
  }

  // ── Main send ──
  async function omniSend(){
    if(isBusy) return;
    const input=document.getElementById('omniTextInput');
    let text=input.value.trim();
    const imgs=[...pendingImages];
    if(!text && imgs.length===0) return;

    document.getElementById('omniWelcome').style.display='none';
    document.getElementById('omniChat').style.display='flex';
    isBusy=true; input.value=''; ti.style.height='22px';
    pendingImages=[]; renderImagePreviews();
    document.getElementById('omniSendBtn').disabled=true;
    const mode=currentMode;

    // OCR if image only
    if(imgs.length && !text){
      history.push({role:'user',text:'📷 Reading image…',images:imgs.map(i=>i.dataUrl),time:timeNow()});
      renderChat(); showTyping('Reading image with OCR…');
      const extracted=await doOCR(imgs[0].dataUrl);
      removeTyping();
      if(extracted && extracted.length>4){ text=extracted; history[history.length-1].text=`📷 From image:\n${extracted}`; renderChat(); }
      else { history.push({role:'ai',text:"I could see the image but couldn't read the text clearly. Please type the question.",time:timeNow()}); renderChat(); isBusy=false; document.getElementById('omniSendBtn').disabled=false; return; }
    } else {
      history.push({role:'user',text,images:imgs.map(i=>i.dataUrl),time:timeNow()});
      renderChat();
    }

    const typingLabels={general:'AI thinking…',jee:'JEE Professor solving…',coding:'Engineer writing code…',math:'Computing step by step…',knowledge:'Researching answer…',image:'Reading image question…'};
    showTyping(typingLabels[mode]||'Thinking…');
    let reply=null, link=null;

    try{
      // ① Instant exact math — zero latency, 100% accurate
      if(isMathQ(text) && ['math','jee','general'].includes(mode)){
        const mr=localMath(text);
        if(mr){ removeTyping(); reply=mr; }
      }

      // ② Ollama local AI (if installed and running — fastest, fully private)
      if(!reply){
        if(ollamaOK===null) await checkOllamaStatus();
        if(ollamaOK){
          try{
            removeTyping(); showTyping('Ollama AI thinking…');
            reply=await callOllama(text,mode,history.slice(0,-1));
          } catch(e){ ollamaOK=false; document.getElementById('omniDot').className='sdot on'; document.getElementById('omniStatusTxt').textContent='Cloud AI ready (Pollinations)'; }
        }
      }

      // ③ DeepSeek (for hard JEE / complex multi-step reasoning) via Pollinations
      if(!reply && needsDeepReasoning(text,mode)){
        try{
          removeTyping(); showTyping('Deep reasoning (DeepSeek)…');
          reply=await callDeepSeek(text,mode,history.slice(0,-1));
        } catch(e){}
      }

      // ④ Pollinations.ai cloud AI — GPT-4o / Qwen / Mistral, free, no key
      if(!reply){
        try{
          removeTyping(); showTyping('AI solving your question…');
          reply=await callPollinations(text,mode,history.slice(0,-1));
        } catch(e){}
      }

      // ⑤ PubChem — exact chemistry data (molar mass, formula, IUPAC)
      if(!reply && ['jee','knowledge','general'].includes(mode)){
        const c=await chemLookup(text); if(c){ removeTyping(); reply=c.text; link=c.link; }
      }

      // ⑥ Wikipedia — factual knowledge fallback
      if(!reply){ const w=await wikiLookup(text); if(w){ removeTyping(); reply=w.text; link=w.link; } }

      // ⑦ DuckDuckGo — instant answers fallback
      if(!reply){ const d=await ddgLookup(text); if(d){ removeTyping(); reply=d.text; link=d.link; } }

      // ⑧ Google search link — absolute last resort
      if(!reply){ removeTyping(); reply="I couldn't produce a confident answer right now. Please try rephrasing, or tap the source link to search Google."; link=`https://www.google.com/search?q=${encodeURIComponent(text)}`; }
    } catch(err){
      removeTyping(); reply="Something went wrong — please try again in a moment."; link=`https://www.google.com/search?q=${encodeURIComponent(text)}`;
    }

    removeTyping();
    history.push({role:'ai',text:reply,link,mode,time:timeNow()});
    // Auto-save to memory
    if(memEnabled() && text.length > 20) memAdd(text);
    renderChat();
    isBusy=false; document.getElementById('omniSendBtn').disabled=false;
    document.getElementById('omniTextInput').focus();
  }

  // ── Prompt Builder ──
  document.getElementById('pbGenBtn').addEventListener('click', async ()=>{
    const idea=document.getElementById('pbIdea').value.trim();
    if(!idea){ alert('Please describe what you want to create.'); return; }
    const audience=document.getElementById('pbAudience').value.trim();
    const style=document.querySelector('input[name="pbStyle"]:checked')?.value||'detailed';
    const pbResult=document.getElementById('pbResult');
    const pbCopyBtn=document.getElementById('pbCopyBtn');
    document.getElementById('pbGenBtn').textContent='Generating…';
    document.getElementById('pbGenBtn').disabled=true;
    pbResult.style.display='none'; pbCopyBtn.style.display='none';

    const promptRequest=`Generate a complete, ready-to-use AI prompt for the following:\n\nGoal: ${idea}\n${audience?'Audience: '+audience+'\n':''}Style: ${style}\n\nThe prompt should include: clear instructions, requirements, features, technical specifications if needed, and expected output format. Make it comprehensive and immediately usable.`;

    let result='';
    if(ollamaOK===null) await checkOllamaStatus();
    if(ollamaOK){
      try{ result=await callOllama(promptRequest,'general',[]); }
      catch(e){ result=''; }
    }
    if(!result){
      try{ result=await callPollinations(promptRequest,'general',[]); } catch(e){ result=''; }
    }
    if(!result){
      // Fallback: generate a structured prompt template
      result=`# AI Prompt: ${idea}\n\n## Goal\n${idea}\n\n## Instructions\nYou are an expert assistant. Your task is to help with: ${idea}.\n\n${audience?`## Target Audience\n${audience}\n\n`:''  }## Requirements\n- Provide accurate, detailed, and helpful responses\n- Break down complex tasks into clear steps\n- Use examples where appropriate\n- Ask clarifying questions if needed\n\n## Output Format\n- Use clear headings for different sections\n- Include code examples if technical\n- Provide step-by-step instructions\n- End with a summary or next steps\n\n## Context\nUser Goal: ${idea}\nStyle: ${style === 'technical' ? 'Technical and precise' : style === 'concise' ? 'Brief and to the point' : 'Detailed and comprehensive'}`;
    }
    pbResult.style.display='block';
    pbResult.textContent=result;
    pbCopyBtn.style.display='inline-block';
    document.getElementById('pbGenBtn').textContent='Generate Prompt ✨';
    document.getElementById('pbGenBtn').disabled=false;
    pbCopyBtn.onclick=()=>{ navigator.clipboard.writeText(result).then(()=>{ pbCopyBtn.textContent='Copied!'; setTimeout(()=>pbCopyBtn.textContent='Copy Prompt',2000); }); };
  });

  // ── Memory panel ──
  function renderMemList(){
    const list=memGet();
    const el=document.getElementById('memList');
    if(!el) return;
    if(!list.length){ el.innerHTML='<div style="color:var(--text-faint);font-size:13px;">No memories saved yet.</div>'; return; }
    el.innerHTML=list.map((m,i)=>`<div class="mem-entry">
      <span>💬 ${m.text.slice(0,90)}${m.text.length>90?'…':''}</span>
      <button class="mem-del" onclick="omniDelMem(${i})">✕</button>
    </div>`).join('');
  }
  window.omniDelMem=function(i){ const m=memGet(); m.splice(i,1); memSave(m); renderMemList(); };

  const memToggle=document.getElementById('memToggle');
  if(memToggle){
    memToggle.checked=memEnabled();
    memToggle.addEventListener('change',()=>{ localStorage.setItem(MEM_ON_KEY,memToggle.checked?'1':'0'); });
  }
  const memSaveBtn=document.getElementById('memSaveBtn');
  if(memSaveBtn){
    const inst=document.getElementById('memInstructions');
    if(inst) inst.value=getInstructions();
    memSaveBtn.addEventListener('click',()=>{
      const v=document.getElementById('memInstructions')?.value||'';
      localStorage.setItem(MEM_INST_KEY,v);
      memSaveBtn.textContent='Saved ✓'; setTimeout(()=>memSaveBtn.textContent='Save Instructions',2000);
    });
  }
  document.getElementById('memClearBtn')?.addEventListener('click',()=>{ memSave([]); renderMemList(); });
  renderMemList();

  // ── Init ──
  checkOllamaStatus();
  renderSuggestions();
}

const ROUTES = {
  '/': { render: pageHome, after: afterHome, navKey:'/' },
  '/assistant': { render: pageAssistant, after: afterAssistant, navKey:'/assistant' },
  '/directory': { render: pageDirectory, after: afterDirectory, navKey:'/directory' },
  '/tool': { render: pageTool, after: afterTool, navKey:'' },
  '/compare': { render: pageCompare, after: afterCompare, navKey:'/compare' },
  '/category': { render: pageCategory, after: afterCategory, navKey:'' },
  '/favorites': { render: pageFavorites, after: afterFavorites, navKey:'' },
  '/premium': { render: pagePremium, after: afterPremium, navKey:'/premium' },
  '/login': { render: pageLogin, after: afterLogin, navKey:'' },
  '/account': { render: pageAccount, after: afterAccount, navKey:'' },
  '/admin': { render: pageAdmin, after: afterAdmin, navKey:'' },
};

function parseHash(){
  let h = location.hash || '#/';
  h = h.slice(1); // remove '#'
  const [path, queryStr] = h.split('?');
  return { path: path || '/', qp: new URLSearchParams(queryStr||'') };
}

function render(){
  const { path, qp } = parseHash();
  const route = ROUTES[path] || ROUTES['/'];
  document.getElementById('navMount').innerHTML = navHTML(route.navKey);
  document.getElementById('footMount').innerHTML = footerHTML();
  document.getElementById('app').innerHTML = route.render(qp);
  renderAccountSlot();
  document.getElementById('burgerBtn')?.addEventListener('click', ()=>document.getElementById('drawer').classList.add('open'));
  document.getElementById('drawerClose')?.addEventListener('click', ()=>document.getElementById('drawer').classList.remove('open'));
  document.querySelectorAll('.mobile-drawer a').forEach(a=>a.addEventListener('click', ()=>document.getElementById('drawer').classList.remove('open')));
  route.after(qp);
  window.scrollTo(0,0);
}

window.addEventListener('hashchange', render);
document.addEventListener('DOMContentLoaded', ()=>{ Theme.init(); render(); });
</script>
